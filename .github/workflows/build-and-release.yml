name: build & release

on:
  push:
    tags: ['v*', 'continuous']
  workflow_dispatch:
    inputs:
      version:
        description: 'Bundle version tag (default: 1.10.0)'
        required: false
        default: '1.10.0'

permissions:
  contents: write

env:
  BUNDLE_VERSION: ${{ github.event.inputs.version || github.ref_name || '1.10.0' }}
  ANDROID_DIR: android

# NOTE: intentionally a SINGLE job. The old 3-job layout passed ~200 MB
# through Actions artifacts on every tag and hit the repo artifact quota.
# All stages run sequentially anyway (needs:), so nothing is lost.
jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Detect build type
        id: build_type
        shell: bash
        run: |
          MSG=$(git log -1 --pretty=%s)
          echo "Commit message: $MSG"
          LOWER=$(echo "$MSG" | tr '[:upper:]' '[:lower:]')
          NEEDS_APK=false
          NEEDS_BUNDLE=true
          if echo "$LOWER" | grep -q '\[android build\]' || echo "$LOWER" | grep -q '\[version build\]'; then
            NEEDS_APK=true
          fi
          if echo "$LOWER" | grep -qE '\[bundle build\]|\[android build\]|\[version build\]'; then
            HAS_MARKER="true"
          else
            HAS_MARKER="false"
          fi
          # Continuous rolling release: every build ships APK + bundle.
          # Unique version per build (run number) so the in-app updater
          # (version.txt string + APK byte check) can tell builds apart.
          if [ "$GITHUB_REF_NAME" = "continuous" ]; then
            NEEDS_APK=true
            HAS_MARKER="true"
            echo "APP_VERSION_NAME=continuous-r${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
            # Epoch seconds: monotonic across CI providers (run numbers and
            # GitLab pipeline IIDs are independent counters → downgrade block).
            echo "APP_VERSION_CODE=$(date -u +%s)" >> "$GITHUB_ENV"
            echo "APK_NAME=nexora_continuous.apk" >> "$GITHUB_ENV"
            echo "BUNDLE_VERSION=continuous-r${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
          else
            echo "APP_VERSION_NAME=${GITHUB_REF_NAME}" >> "$GITHUB_ENV"
            echo "APP_VERSION_CODE=$(date -u +%s)" >> "$GITHUB_ENV"
            echo "APK_NAME=nexora_v${GITHUB_REF_NAME#v}.apk" >> "$GITHUB_ENV"
          fi
          # Escape multiline for GitHub Actions output
          ESCAPED=$(echo "$MSG" | head -1 | sed 's/"/\\"/g')
          echo "commit_msg=$ESCAPED" >> "$GITHUB_OUTPUT"
          echo "needs_apk=$NEEDS_APK" >> "$GITHUB_OUTPUT"
          echo "needs_bundle=$NEEDS_BUNDLE" >> "$GITHUB_OUTPUT"
          echo "has_build_marker=$HAS_MARKER" >> "$GITHUB_OUTPUT"
          echo "APK build: $NEEDS_APK | Bundle build: $NEEDS_BUNDLE"
          # --- native skip guard: reuse the previous .so set when nothing
          # native changed (saves ~5 min on app/addons/CI-only changes).
          # Guard inputs: repo diff on native watch paths + HEAD SHAs of the
          # floating upstream sources (unpinned master/branch clones).
          SKIP_NATIVE=false
          NATIVE_SHA_OUT=$(git rev-parse HEAD)
          UP_AMXX=$(git ls-remote https://github.com/alliedmodders/amxmodx.git HEAD 2>/dev/null | cut -f1)
          UP_MM=$(git ls-remote https://github.com/FWGS/metamod-fwgs.git HEAD 2>/dev/null | cut -f1)
          UP_REAPI=$(git ls-remote https://github.com/rehlds/ReAPI.git HEAD 2>/dev/null | cut -f1)
          UP_YAPB=$(git ls-remote https://github.com/yapb/yapb.git HEAD 2>/dev/null | cut -f1)
          UP_RGDLL=$(git ls-remote https://github.com/berkchy/ReGameDLL_CS.git fix/first-spawn-equip 2>/dev/null | cut -f1)
          UP_JSON=$(python3 -c "import json; print(json.dumps({'amxmodx':'$UP_AMXX','metamod':'$UP_MM','reapi':'$UP_REAPI','yapb':'$UP_YAPB','regamedll':'$UP_RGDLL'}))")
          if [ "$GITHUB_REF_NAME" = "continuous" ] && [ -n "$UP_AMXX" ]; then
            META_JSON=$(curl -fsSL --max-time 30 "https://github.com/${GITHUB_REPOSITORY}/releases/download/continuous/build-meta.json" 2>/dev/null || true)
            NATIVE_SHA=$(echo "$META_JSON" | python3 -c "import json,sys; print(json.load(sys.stdin).get('native_sha',''))" 2>/dev/null || true)
            if [ -n "$NATIVE_SHA" ]; then
              git fetch --depth 1 origin "$NATIVE_SHA" 2>/dev/null || NATIVE_SHA=""
            fi
            if [ -n "$NATIVE_SHA" ]; then
              META_UP=$(echo "$META_JSON" | python3 -c "import json,sys; print(json.dumps(json.load(sys.stdin).get('upstreams',{}),sort_keys=True))" 2>/dev/null || echo "")
              CUR_UP=$(echo "$UP_JSON" | python3 -c "import json,sys; print(json.dumps(json.load(sys.stdin),sort_keys=True))" 2>/dev/null || echo "")
              DIFF_OUT=$(git diff --name-only "$NATIVE_SHA" HEAD -- android/ci patches vcs16 3rdparty .github/workflows 2>/dev/null || echo "DIFF-FAILED")
              if [ "$DIFF_OUT" != "DIFF-FAILED" ] && [ -z "$DIFF_OUT" ] && [ -n "$META_UP" ] && [ "$META_UP" = "$CUR_UP" ]; then
                SKIP_NATIVE=true
                NATIVE_SHA_OUT=$NATIVE_SHA
              fi
            fi
          fi
          echo "skip_native=$SKIP_NATIVE" >> "$GITHUB_OUTPUT"
          echo "native_sha_out=$NATIVE_SHA_OUT" >> "$GITHUB_OUTPUT"
          echo "upstreams_json=$UP_JSON" >> "$GITHUB_OUTPUT"
          echo "Native skip: $SKIP_NATIVE (native_sha: $NATIVE_SHA_OUT)"

      - name: Set up JDK
        if: steps.build_type.outputs.needs_apk == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK/NDK tooling
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - name: Install NDK r25c
        shell: bash
        run: |
          echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "ndk;25.2.9519653" \
            || (SDKM=$(ls -d $ANDROID_HOME/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1); \
                [ -n "$SDKM" ] && echo "y" | "$SDKM" "ndk;25.2.9519653")
          NDK_ROOT=$(ls -d "$ANDROID_HOME"/ndk/25.2.9519653 2>/dev/null)
          echo "ANDROID_NDK_HOME=$NDK_ROOT" >> "$GITHUB_ENV"
          command -v cmake >/dev/null || sudo apt-get update
          command -v cmake >/dev/null || sudo apt-get install -y cmake
          command -v ninja >/dev/null || sudo apt-get install -y ninja-build

      - name: Setup ccache
        if: steps.build_type.outputs.skip_native != 'true'
        shell: bash
        run: |
          command -v ccache >/dev/null 2>&1 || { sudo apt-get update -qq && sudo apt-get install -y -qq ccache; } || true
          echo "CCACHE=$(command -v ccache || echo '')" >> "$GITHUB_ENV"
          mkdir -p "$GITHUB_WORKSPACE/.ccache"
          if [ -n "$(command -v ccache || true)" ]; then
            echo "CCACHE_DIR=$GITHUB_WORKSPACE/.ccache" >> "$GITHUB_ENV"
            echo "CCACHE_MAXSIZE=1G" >> "$GITHUB_ENV"
            echo "CCACHE_COMPILERTYPE=clang" >> "$GITHUB_ENV"
            echo "CCACHE_SLOPPINESS=time_macros" >> "$GITHUB_ENV"
            echo "CCACHE_BASEDIR=$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
            ccache --zero-stats || true
          fi

      - name: Restore ccache
        if: steps.build_type.outputs.skip_native != 'true'
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-ndk-r25c-${{ hashFiles('android/ci/build-amxx.sh') }}
          restore-keys: ccache-ndk-r25c-

      - name: Cross-compile core + modules + plugins
        if: steps.build_type.outputs.skip_native != 'true'
        shell: bash
        run: |
          # amxmodx is fetched from upstream by build-amxx.sh and customized
          # by ./patches/; hlsdk + metamod-p are checked out as git submodules
          # under 3rdparty/ (berkchy/hlsdk, berkchy/mm-p), so no overlay copy
          # step is needed.
          # arm64-v8a is mandatory; armeabi-v7a is best-effort (trial) and its
          # failure only drops the v7a bundle, it never fails the workflow.
          for ABI in arm64-v8a armeabi-v7a; do
            if RELEASE_VERSION="$BUNDLE_VERSION" bash ./android/ci/build-amxx.sh "$GITHUB_WORKSPACE/src" "$ANDROID_NDK_HOME" \
                "$GITHUB_WORKSPACE/build-out" "" "$ABI"; then
              echo "::group::OK $ABI"
              ls -l "$GITHUB_WORKSPACE/build-out/lib/$ABI" 2>/dev/null
              echo "::endgroup::"
            else
              echo "::endgroup::"
              if [ "$ABI" = "arm64-v8a" ]; then
                echo "::error::arm64-v8a cross-compile failed (required)"
                exit 1
              fi
              echo "::warning::armeabi-v7a cross-compile failed — v7a bundle will be skipped"
              touch "$GITHUB_WORKSPACE/v7a-missing"
            fi
          done

      - name: ccache stats (post native)
        if: steps.build_type.outputs.skip_native != 'true'
        shell: bash
        run: |
          if [ -n "${CCACHE:-}" ]; then ccache --show-stats || true; fi

      - name: Restore native outputs from release
        if: steps.build_type.outputs.skip_native == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Native inputs unchanged: reuse the previous .so set (+ on-device
          # compiler) instead of recompiling. Manifests/zip are regenerated
          # below with the new version.
          mkdir -p /tmp/prevso \
            "$GITHUB_WORKSPACE/build-out/lib/arm64-v8a" \
            "$GITHUB_WORKSPACE/build-out/lib/armeabi-v7a" \
            "$GITHUB_WORKSPACE/build-out/compiler/arm64-v8a" \
            "$GITHUB_WORKSPACE/build-out/compiler/armeabi-v7a" \
            "$GITHUB_WORKSPACE/build-out/plugins"
          cd /tmp/prevso
          gh release download continuous --repo "$GITHUB_REPOSITORY" \
            --pattern 'arm64-v8a__*' --pattern 'armeabi-v7a__*' --pattern 'compiler-*' \
            --clobber
          shopt -s nullglob
          for f in *; do
            case "$f" in
              compiler-arm64-v8a__*) cp "$f" "$GITHUB_WORKSPACE/build-out/compiler/arm64-v8a/${f#compiler-arm64-v8a__}" ;;
              compiler-armeabi-v7a__*) cp "$f" "$GITHUB_WORKSPACE/build-out/compiler/armeabi-v7a/${f#compiler-armeabi-v7a__}" ;;
              arm64-v8a__*) cp "$f" "$GITHUB_WORKSPACE/build-out/lib/arm64-v8a/${f#arm64-v8a__}" ;;
              armeabi-v7a__*) cp "$f" "$GITHUB_WORKSPACE/build-out/lib/armeabi-v7a/${f#armeabi-v7a__}" ;;
            esac
          done
          BO="$GITHUB_WORKSPACE/build-out"
          N64=$(ls "$BO/lib/arm64-v8a" | wc -l)
          echo "restored arm64 libs: $N64"
          [ "$N64" -ge 10 ] || { echo "::error::restore failed: too few arm64 libs"; exit 1; }
          [ -f "$BO/lib/arm64-v8a/libamxmodx.so" ] || { echo "::error::restore failed: no arm64 libamxmodx"; exit 1; }
          [ -f "$BO/compiler/arm64-v8a/amxxpc" ] || { echo "::error::restore failed: no compiler"; exit 1; }
          [ -f "$BO/lib/armeabi-v7a/libamxmodx.so" ] || touch "$GITHUB_WORKSPACE/v7a-missing"

      - name: Build ReGameDLL libcs (first-spawn fix)
        if: steps.build_type.outputs.skip_native != 'true'
        shell: bash
        run: |
          set -euo pipefail
          # libcs is bundled from the berkchy/ReGameDLL_CS fork branch carrying the
          # first-spawn fix; built standalone with the NDK already installed above.
          RGDLL="$GITHUB_WORKSPACE/rgdll-src"
          rm -rf "$RGDLL" "$GITHUB_WORKSPACE/rgdll-build"
          git clone --depth 1 --branch fix/first-spawn-equip \
            https://github.com/berkchy/ReGameDLL_CS.git "$RGDLL"
          cmake -S "$RGDLL" -B "$GITHUB_WORKSPACE/rgdll-build" \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" \
            -DCMAKE_C_COMPILER_LAUNCHER="${CCACHE:-}" \
            -DCMAKE_CXX_COMPILER_LAUNCHER="${CCACHE:-}" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-21 \
            -DXASH_COMPAT=ON \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build "$GITHUB_WORKSPACE/rgdll-build" --target regamedll --parallel 2
          SO="$GITHUB_WORKSPACE/rgdll-build/regamedll/libcs_android_arm64.so"
          test -f "$SO" || { echo "::error::libcs_android_arm64.so was not produced"; exit 1; }
          mkdir -p "$GITHUB_WORKSPACE/build-out/lib/arm64-v8a"
          cp "$SO" "$GITHUB_WORKSPACE/build-out/lib/arm64-v8a/libcs_android_arm64.so"
          ls -l "$GITHUB_WORKSPACE/build-out/lib/arm64-v8a/libcs_android_arm64.so"

      - name: Package release bundles
        shell: bash
        run: |
          # Incremental update: individual .so files + manifest.json
          RELEASE_VERSION="$BUNDLE_VERSION" python3 ./android/ci/gen-manifest.py \
            arm64-v8a \
            "$GITHUB_WORKSPACE/build-out/lib/arm64-v8a" \
            "$GITHUB_WORKSPACE/incremental" \
            --plugins-dir "$GITHUB_WORKSPACE/build-out/plugins"
          # Rename manifest for arm64 (default ABI keeps manifest.json name)
          mv "$GITHUB_WORKSPACE/incremental/manifest.json" "$GITHUB_WORKSPACE/manifest.json"

          if [ ! -f "$GITHUB_WORKSPACE/v7a-missing" ] && \
              [ -f "$GITHUB_WORKSPACE/build-out/lib/armeabi-v7a/libamxmodx.so" ]; then
            RELEASE_VERSION="$BUNDLE_VERSION" python3 ./android/ci/gen-manifest.py \
              armeabi-v7a \
              "$GITHUB_WORKSPACE/build-out/lib/armeabi-v7a" \
              "$GITHUB_WORKSPACE/incremental-v7a"
            # Rename manifest for v7a to avoid conflict
            mv "$GITHUB_WORKSPACE/incremental-v7a/manifest.json" "$GITHUB_WORKSPACE/manifest-v7a.json"
          fi

          # Addons zip
          cd "$GITHUB_WORKSPACE"
          zip -r amxx-addons.zip addons/ -x '*.git*'

          # build-meta.json: lets the next run's skip guard know which commit
          # + upstream SHAs the native outputs correspond to.
          UPSTREAMS_JSON='${{ steps.build_type.outputs.upstreams_json }}' \
          NATIVE_SHA_OUT='${{ steps.build_type.outputs.native_sha_out }}' \
          python3 - "$GITHUB_WORKSPACE/build-meta.json" <<'PY'
          import json, os, subprocess, sys
          out = sys.argv[1]
          commit = subprocess.run(['git', 'rev-parse', 'HEAD'],
                                  capture_output=True, text=True).stdout.strip()
          try:
              upstreams = json.loads(os.environ.get('UPSTREAMS_JSON', '{}'))
          except Exception:
              upstreams = {}
          native_sha = os.environ.get('NATIVE_SHA_OUT') or commit
          json.dump({"commit": commit, "native_sha": native_sha,
                     "upstreams": upstreams}, open(out, 'w'))
          print(open(out).read())
          PY

          # Stage on-device compiler binaries as ABI-prefixed release assets
          # (plain names would collide across ABIs).
          mkdir -p "$GITHUB_WORKSPACE/compiler-assets"
          cf="$GITHUB_WORKSPACE/build-out/compiler"
          [ -f "$cf/arm64-v8a/amxxpc" ] && cp "$cf/arm64-v8a/amxxpc" "$GITHUB_WORKSPACE/compiler-assets/compiler-arm64-v8a__amxxpc"
          [ -f "$cf/arm64-v8a/amxxpc32.so" ] && cp "$cf/arm64-v8a/amxxpc32.so" "$GITHUB_WORKSPACE/compiler-assets/compiler-arm64-v8a__amxxpc32.so"
          if [ ! -f "$GITHUB_WORKSPACE/v7a-missing" ]; then
            [ -f "$cf/armeabi-v7a/amxxpc" ] && cp "$cf/armeabi-v7a/amxxpc" "$GITHUB_WORKSPACE/compiler-assets/compiler-armeabi-v7a__amxxpc"
            [ -f "$cf/armeabi-v7a/amxxpc32.so" ] && cp "$cf/armeabi-v7a/amxxpc32.so" "$GITHUB_WORKSPACE/compiler-assets/compiler-armeabi-v7a__amxxpc32.so"
          fi
          ls "$GITHUB_WORKSPACE/compiler-assets" || true

      - name: Install Android SDK platform & build tools
        if: steps.build_type.outputs.needs_apk == 'true'
        shell: bash
        run: |
          # The runner's preinstalled sdkmanager is too old for current SDK XML
          # (v4), which silently breaks --install. Use a fresh cmdline-tools zip.
          CMDT=commandlinetools-linux-11076708_latest.zip
          mkdir -p "$RUNNER_TEMP/sdkman"
          curl -fsSL -o "$RUNNER_TEMP/$CMDT" "https://dl.google.com/android/repository/$CMDT"
          rm -rf "$RUNNER_TEMP/sdkman/cmdline-tools"
          unzip -qo "$RUNNER_TEMP/$CMDT" -d "$RUNNER_TEMP/sdkman"
          SDKM="$RUNNER_TEMP/sdkman/cmdline-tools/bin/sdkmanager"
          yes | "$SDKM" --sdk_root="$ANDROID_HOME" --licenses >/dev/null 2>&1 || true
          "$SDKM" --sdk_root="$ANDROID_HOME" --install "platforms;android-36" "build-tools;35.0.0"
          test -d "$ANDROID_HOME/platforms/android-36"
          test -d "$ANDROID_HOME/build-tools/35.0.0"

      - name: Set up Gradle
        if: steps.build_type.outputs.needs_apk == 'true'
        uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: false

      - name: Bundle debug signing keystore into app assets
        if: steps.build_type.outputs.needs_apk == 'true'
        shell: bash
        run: |
          mkdir -p android/app/src/main/assets/keystore
          cp android/debug/patcher-release.p12 android/app/src/main/assets/keystore/debug.p12
          cp android/debug/debug_key.pem android/app/src/main/assets/keystore/debug_key.pem
          cp android/debug/debug_cert.pem android/app/src/main/assets/keystore/debug_cert.pem

      - name: Embed amxxpc compiler as native libs
        if: steps.build_type.outputs.needs_apk == 'true'
        shell: bash
        run: |
          # amxxpc compiler (produced by build-amxx.sh)
          mkdir -p android/app/src/main/jniLibs/arm64-v8a
          cp "$GITHUB_WORKSPACE/build-out/compiler/arm64-v8a/amxxpc" android/app/src/main/jniLibs/arm64-v8a/libamxxpc.so
          cp "$GITHUB_WORKSPACE/build-out/compiler/arm64-v8a/amxxpc32.so" android/app/src/main/jniLibs/arm64-v8a/libamxxpc32.so
          chmod +x android/app/src/main/jniLibs/arm64-v8a/libamxxpc.so
          # armeabi-v7a compiler (best-effort)
          if [ ! -f "$GITHUB_WORKSPACE/v7a-missing" ] && \
              [ -f "$GITHUB_WORKSPACE/build-out/compiler/armeabi-v7a/amxxpc" ]; then
            mkdir -p android/app/src/main/jniLibs/armeabi-v7a
            cp "$GITHUB_WORKSPACE/build-out/compiler/armeabi-v7a/amxxpc" android/app/src/main/jniLibs/armeabi-v7a/libamxxpc.so
            cp "$GITHUB_WORKSPACE/build-out/compiler/armeabi-v7a/amxxpc32.so" android/app/src/main/jniLibs/armeabi-v7a/libamxxpc32.so
            chmod +x android/app/src/main/jniLibs/armeabi-v7a/libamxxpc.so
          fi
          ls -lh android/app/src/main/jniLibs/arm64-v8a/

      - name: Build the patcher APK
        if: steps.build_type.outputs.needs_apk == 'true'
        working-directory: android
        env:
          APP_VERSION_NAME: ${{ env.APP_VERSION_NAME }}
          APP_VERSION_CODE: ${{ env.APP_VERSION_CODE }}
        run: ./gradlew --no-daemon :app:assembleRelease --stacktrace

      - name: Rename APK to nexora_vX.X.X.apk
        if: steps.build_type.outputs.needs_apk == 'true'
        shell: bash
        run: |
          cd android/app/build/outputs/apk/release
          APK=$(ls *.apk 2>/dev/null | head -1)
          if [ -n "$APK" ]; then
            mv "$APK" "${APK_NAME:-nexora.apk}"
            echo "Renamed: ${APK_NAME:-nexora.apk}"
          fi
          # version stamp for the in-app updater (version.txt string + byte check)
          echo "${APP_VERSION_NAME:-unknown}" > "$GITHUB_WORKSPACE/version.txt"
          cat "$GITHUB_WORKSPACE/version.txt"

      - name: Release (rolling continuous)
        if: startsWith(github.ref, 'refs/tags/') && github.ref_name == 'continuous'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Rolling release: the tag + release stay, only assets are replaced.
          # On a bundle-only build the APK + version.txt are left untouched
          # (no APK is built, so they must survive).
          if ! gh release view continuous >/dev/null 2>&1; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -f continuous
            git push origin continuous
            gh release create continuous \
              --title "Nexora Continuous" \
              --notes "Nexora Continuous build"
          fi
          if [ "${{ steps.build_type.outputs.needs_apk }}" = "true" ]; then
            PRESERVE='^$'
          else
            PRESERVE='^(nexora_continuous\.apk|version\.txt)$'
          fi
          gh release view continuous --json assets | jq -r '.assets[] | .name' | while read -r name; do
            [ -z "$name" ] && continue
            if echo "$name" | grep -qE "$PRESERVE"; then
              echo "Keeping: $name"
            else
              echo "Deleting: $name"
              gh release delete-asset continuous "$name" -y || true
            fi
          done
          BODY="Nexora Continuous build ${APP_VERSION_NAME:-}
          Commit: ${{ steps.build_type.outputs.commit_msg }}
          Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          Built: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          gh release edit continuous --title "Nexora Continuous" --notes "$BODY"
          shopt -s nullglob
          FILES=(amxx-addons.zip manifest.json manifest-v7a.json build-meta.json incremental/arm64-v8a/*.so incremental-v7a/armeabi-v7a/*.so compiler-assets/*)
          if [ "${{ steps.build_type.outputs.needs_apk }}" = "true" ]; then
            FILES+=(version.txt android/app/build/outputs/apk/release/*.apk)
          fi
          gh release upload continuous --clobber "${FILES[@]}"

      - name: Release
        if: startsWith(github.ref, 'refs/tags/') && github.ref_name != 'continuous'
        uses: softprops/action-gh-release@v2
        with:
          body: ${{ steps.build_type.outputs.commit_msg }}
          files: |
            amxx-addons.zip
            manifest.json
            manifest-v7a.json
            build-meta.json
            version.txt
            compiler-assets/*
            incremental/arm64-v8a/*.so
            incremental-v7a/armeabi-v7a/*.so
            ${{ steps.build_type.outputs.needs_apk == 'true' && 'android/app/build/outputs/apk/release/*.apk' || '' }}
          generate_release_notes: true
          fail_on_unmatched_files: false

      - name: Notify Discord on successful release
        if: success() && startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          if [ -z "$DISCORD_WEBHOOK" ]; then
            echo "DISCORD_WEBHOOK secret not set, skipping Discord notification"
            exit 0
          fi
          VERSION="${GITHUB_REF_NAME#v}"
          APK_FILE="nexora_v${VERSION}.apk"
          if [ "$GITHUB_REF_NAME" = "continuous" ]; then
            VERSION="${APP_VERSION_NAME:-continuous}"
            APK_FILE="nexora_continuous.apk"
          fi
          REPO="${GITHUB_REPOSITORY}"
          COMMIT_MSG=$(echo '${{ steps.build_type.outputs.commit_msg }}' | head -c 500)
          HAS_MARKER='${{ steps.build_type.outputs.has_build_marker }}'
          RELEASE_URL="https://github.com/${REPO}/releases/tag/${GITHUB_REF_NAME}"
          if compgen -G "android/app/build/outputs/apk/release/*.apk" >/dev/null; then
            APK_COUNT=$(ls android/app/build/outputs/apk/release/*.apk | wc -l)
          else
            APK_COUNT=0
          fi
          if [ "$APK_COUNT" -gt 0 ]; then
            TITLE="Nexora v${VERSION} released"
            if [ "$GITHUB_REF_NAME" = "continuous" ]; then
              TITLE="Nexora Continuous build ${VERSION}"
            fi
            STATUS_FIELD=":white_check_mark: App update ready"
            TYPE_FIELD="App + libs"
            APK_URL="https://github.com/${REPO}/releases/download/${GITHUB_REF_NAME}/${APK_FILE}"
            APK_FIELD=", { \"name\": \"Download\", \"value\": \"[${APK_FILE}](${APK_URL})\", \"inline\": true }"
          elif [ "$HAS_MARKER" = "true" ]; then
            TITLE="Nexora v${VERSION} libs & plugins update"
            STATUS_FIELD=":white_check_mark: Libs & plugins updated"
            TYPE_FIELD="Bundle (libs & plugins)"
            APK_FIELD=""
          else
            # Marker-less commit (docs/config/infra): no app or lib changes,
            # announce the tag as a plain update notice.
            TITLE="Nexora v${VERSION} update info"
            STATUS_FIELD=":information_source: Update posted"
            TYPE_FIELD="Update info"
            APK_FIELD=""
          fi
          BODY=$(cat <<EOF
          {
            "embeds": [{
              "title": "${TITLE}",
              "description": "$COMMIT_MSG",
              "color": 5763719,
              "url": "${RELEASE_URL}",
              "thumbnail": { "url": "attachment://thumbnail.jpg" },
              "image": { "url": "attachment://image.jpg" },
              "fields": [
                { "name": "Status", "value": "${STATUS_FIELD}", "inline": true },
                { "name": "Version", "value": "${VERSION}", "inline": true },
                { "name": "Type", "value": "${TYPE_FIELD}", "inline": true }${APK_FIELD}
              ]
            }]
          }
          EOF
          )
          curl -fsSL -F "payload_json=$BODY" \
            -F "thumbnail=@.github/assets/thumbnail.jpg" \
            -F "image=@.github/assets/image.jpg" \
            "$DISCORD_WEBHOOK" 2>&1 >/dev/null || { echo "Failed to send Discord webhook (exit=$?)"; exit 0; }
