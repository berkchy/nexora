name: build & release

on:
  push:
    tags: ['v*', 'continuous']
  workflow_dispatch:
    inputs:
      version:
        description: 'Bundle version tag (default: 1.10.0)'
        required: false
        default: '1.10.0'

permissions:
  contents: write

env:
  BUNDLE_VERSION: ${{ github.event.inputs.version || github.ref_name || '1.10.0' }}
  ANDROID_DIR: android
  CS16_CLIENT_URL: https://github.com/Velaron/cs16-client.git

# NOTE: intentionally a SINGLE job. The old 3-job layout passed ~200 MB
# through Actions artifacts on every tag and hit the repo artifact quota.
# All stages run sequentially anyway (needs:), so nothing is lost.
jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # cs16-client is a plain directory, not a submodule, so `submodules: recursive`
      # does not fetch it and `git diff` cannot see it change. cs16-client.pin
      # holds the commit to build and takes that role: changing it is what makes
      # the native rebuild notice, exactly as moving a gitlink used to.
      - name: Fetch cs16-client
        shell: bash
        run: |
          set -euo pipefail
          PIN=$(tr -d '[:space:]' < cs16-client.pin)
          [ -n "$PIN" ] || { echo "::error::cs16-client.pin is empty"; exit 1; }
          git clone "$CS16_CLIENT_URL" cs16-client
          git -C cs16-client fetch origin "$PIN" 2>/dev/null || git -C cs16-client fetch origin
          git -C cs16-client checkout "$PIN"
          git -C cs16-client submodule update --init --recursive
          GOT=$(git -C cs16-client rev-parse HEAD)
          [ "$GOT" = "$PIN" ] || { echo "::error::cs16-client is $GOT, pin says $PIN"; exit 1; }
          echo "cs16-client -> $GOT"

      - name: Detect build type
        id: build_type
        shell: bash
        run: |
          MSG=$(git log -1 --pretty=%s)
          echo "Commit message: $MSG"
          LOWER=$(echo "$MSG" | tr '[:upper:]' '[:lower:]')
          # What gets built comes from the commit message and nothing else:
          #   [android] -> the patcher APK, with the on-device compilers in it
          #   [libs]    -> the .so set: amxx core/modules, plugins, game dlls
          # A commit with neither marker builds nothing, so docs/config/infra
          # pushes no longer spend a runner compiling an APK and 40 libraries.
          NEEDS_ANDROID=false
          NEEDS_LIBS=false
          if echo "$LOWER" | grep -q '\[android\]'; then NEEDS_ANDROID=true; fi
          if echo "$LOWER" | grep -q '\[libs\]'; then NEEDS_LIBS=true; fi
          # Legacy markers still accepted.
          if echo "$LOWER" | grep -qE '\[android build\]|\[version build\]'; then NEEDS_ANDROID=true; fi
          if echo "$LOWER" | grep -qE '\[bundle build\]'; then NEEDS_LIBS=true; fi
          # The continuous channel is built either from the continuous tag or
          # from a manual run on master - otherwise a plain commit that touches
          # cs16-client or android/ci would need the tag force-moved under it, and a
          # dispatch on master would publish nexora_vmaster.apk into the
          # continuous release.
          CONTINUOUS=false
          if [ "$GITHUB_REF_NAME" = "continuous" ]; then
            CONTINUOUS=true
          fi
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            if [ "$GITHUB_REF_NAME" = "master" ]; then
              CONTINUOUS=true
            fi
          fi
          if [ "$CONTINUOUS" = true ]; then
            echo "APP_VERSION_NAME=continuous-r${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
            # Epoch seconds: monotonic across CI providers (run numbers and
            # GitLab pipeline IIDs are independent counters -> downgrade block).
            echo "APP_VERSION_CODE=$(date -u +%s)" >> "$GITHUB_ENV"
            echo "APK_NAME=nexora_continuous.apk" >> "$GITHUB_ENV"
            echo "BUNDLE_VERSION=continuous-r${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
          else
            echo "APP_VERSION_NAME=${GITHUB_REF_NAME}" >> "$GITHUB_ENV"
            echo "APP_VERSION_CODE=$(date -u +%s)" >> "$GITHUB_ENV"
            echo "APK_NAME=nexora_v${GITHUB_REF_NAME#v}.apk" >> "$GITHUB_ENV"
          fi
          # Escape multiline for GitHub Actions output
          ESCAPED=$(echo "$MSG" | head -1 | sed 's/"/\\"/g')
          echo "commit_msg=$ESCAPED" >> "$GITHUB_OUTPUT"
          echo "needs_android=$NEEDS_ANDROID" >> "$GITHUB_OUTPUT"
          echo "needs_libs=$NEEDS_LIBS" >> "$GITHUB_OUTPUT"
          echo "APK build: $NEEDS_ANDROID | Libs build: $NEEDS_LIBS"
          if [ "$NEEDS_ANDROID" != "true" ] && [ "$NEEDS_LIBS" != "true" ]; then
            echo "::notice::no [android] / [libs] marker in the commit message - nothing to build"
          fi

          # --- native skip guard: when [libs] is asked for but nothing native
          # changed, reuse the previous .so set instead of recompiling (~5 min).
          # Guard inputs: repo diff on native watch paths + HEAD SHAs of the
          # floating upstream sources (unpinned master/branch clones).
          SKIP_NATIVE=false
          NATIVE_SHA_OUT=$(git rev-parse HEAD)
          if [ "$NEEDS_LIBS" = "true" ]; then
            UP_AMXX=$(git ls-remote https://github.com/alliedmodders/amxmodx.git HEAD 2>/dev/null | cut -f1)
            UP_MM=$(git ls-remote https://github.com/FWGS/metamod-fwgs.git HEAD 2>/dev/null | cut -f1)
            UP_REAPI=$(git ls-remote https://github.com/rehlds/ReAPI.git HEAD 2>/dev/null | cut -f1)
            # YaPB is a submodule now: report the pinned commit and what upstream has
            UP_YAPB=$(git -C 3rdparty/yapb rev-parse HEAD 2>/dev/null)
            UP_YAPB_UPSTREAM=$(git ls-remote https://github.com/yapb/yapb.git HEAD 2>/dev/null | cut -f1)
            UP_RGDLL=$(git ls-remote https://github.com/berkchy/ReGameDLL_CS.git fix/first-spawn-equip 2>/dev/null | cut -f1)
            UP_JSON=$(python3 -c "import json; print(json.dumps({'amxmodx':'$UP_AMXX','metamod':'$UP_MM','reapi':'$UP_REAPI','yapb':'$UP_YAPB','yapb_upstream':'$UP_YAPB_UPSTREAM','regamedll':'$UP_RGDLL'}))")
            if [ "$GITHUB_REF_NAME" = "continuous" ] && [ -n "$UP_AMXX" ]; then
              META_JSON=$(curl -fsSL --max-time 30 "https://github.com/${GITHUB_REPOSITORY}/releases/download/continuous/build-meta.json" 2>/dev/null || true)
              NATIVE_SHA=$(echo "$META_JSON" | python3 -c "import json,sys; print(json.load(sys.stdin).get('native_sha',''))" 2>/dev/null || true)
              if [ -n "$NATIVE_SHA" ]; then
                git fetch --depth 1 origin "$NATIVE_SHA" 2>/dev/null || NATIVE_SHA=""
              fi
              if [ -n "$NATIVE_SHA" ]; then
                META_UP=$(echo "$META_JSON" | python3 -c "import json; print(json.dumps(json.load(sys.stdin).get('upstreams',{}),sort_keys=True))" 2>/dev/null || echo "")
                CUR_UP=$(echo "$UP_JSON" | python3 -c "import json; print(json.dumps(json.load(sys.stdin),sort_keys=True))" 2>/dev/null || echo "")
                DIFF_OUT=$(git diff --name-only "$NATIVE_SHA" HEAD -- android/ci patches cs16-client.pin cs16-client-launcher.patch 3rdparty .github/workflows 2>/dev/null || echo "DIFF-FAILED")
                if [ "$DIFF_OUT" != "DIFF-FAILED" ] && [ -z "$DIFF_OUT" ] && [ -n "$META_UP" ] && [ "$META_UP" = "$CUR_UP" ]; then
                  SKIP_NATIVE=true
                  NATIVE_SHA_OUT=$NATIVE_SHA
                fi
              fi
            fi
          fi
          echo "skip_native=$SKIP_NATIVE" >> "$GITHUB_OUTPUT"
          echo "native_sha_out=$NATIVE_SHA_OUT" >> "$GITHUB_OUTPUT"
          echo "Native skip: $SKIP_NATIVE (native_sha: $NATIVE_SHA_OUT)"

      - name: Set up JDK
        if: steps.build_type.outputs.needs_android == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          # Stays on 17. :patcherlib sets sourceCompatibility/targetCompatibility
          # to 17 but no jvmTarget, so compileKotlin follows the daemon's JVM and
          # any bump here fails with "Inconsistent JVM Target Compatibility".
          # cs16-client wants 21 and declares it in its own
          # gradle-daemon-jvm.properties, so its gradle invocation provisions
          # that itself and does not need this to move.
          java-version: '17'

      - name: Set up Android SDK/NDK tooling
        if: steps.build_type.outputs.needs_android == 'true' || steps.build_type.outputs.needs_libs == 'true'
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - name: Install NDK r25c
        if: steps.build_type.outputs.needs_android == 'true' || steps.build_type.outputs.needs_libs == 'true'
        shell: bash
        run: |
          echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "ndk;25.2.9519653" \
            || (SDKM=$(ls -d $ANDROID_HOME/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1); \
                [ -n "$SDKM" ] && echo "y" | "$SDKM" "ndk;25.2.9519653")
          NDK_ROOT=$(ls -d "$ANDROID_HOME"/ndk/25.2.9519653 2>/dev/null)
          echo "ANDROID_NDK_HOME=$NDK_ROOT" >> "$GITHUB_ENV"
          command -v cmake >/dev/null || sudo apt-get update
          command -v cmake >/dev/null || sudo apt-get install -y cmake
          command -v ninja >/dev/null || sudo apt-get install -y ninja-build

      - name: Setup ccache
        if: steps.build_type.outputs.needs_libs == 'true' && steps.build_type.outputs.skip_native != 'true'
        shell: bash
        run: |
          command -v ccache >/dev/null 2>&1 || { sudo apt-get update -qq && sudo apt-get install -y -qq ccache; } || true
          echo "CCACHE=$(command -v ccache || echo '')" >> "$GITHUB_ENV"
          mkdir -p "$GITHUB_WORKSPACE/.ccache"
          if [ -n "$(command -v ccache || true)" ]; then
            echo "CCACHE_DIR=$GITHUB_WORKSPACE/.ccache" >> "$GITHUB_ENV"
            echo "CCACHE_MAXSIZE=1G" >> "$GITHUB_ENV"
            echo "CCACHE_COMPILERTYPE=clang" >> "$GITHUB_ENV"
            echo "CCACHE_SLOPPINESS=time_macros" >> "$GITHUB_ENV"
            echo "CCACHE_BASEDIR=$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
            ccache --zero-stats || true
          fi

      - name: Restore ccache
        if: steps.build_type.outputs.needs_libs == 'true' && steps.build_type.outputs.skip_native != 'true'
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-ndk-r25c-${{ hashFiles('android/ci/build-amxx.sh') }}
          restore-keys: ccache-ndk-r25c-

      - name: Check the client/engine ABI
        if: steps.build_type.outputs.needs_libs == 'true'
        shell: bash
        run: |
          # The engine hands cl_enginefunc_t to the client dll by value, so a dll
          # built against more slots than the engine has reads past the end of
          # the engine's table and calls whatever pointer follows it - which
          # breaks every player who has not updated their engine APK yet. Cheap
          # to check, so it runs before the long cross-compile.
          python3 ./android/ci/check-engine-abi.py

      - name: Cross-compile core + modules + plugins
        if: steps.build_type.outputs.needs_libs == 'true' && steps.build_type.outputs.skip_native != 'true'
        shell: bash
        run: |
          # Every source is a submodule under 3rdparty/ and carries its own
          # changes as commits: berkchy/amxmodx, berkchy/mm-p,
          # berkchy/metamod-fwgs, berkchy/hlsdk, berkchy/yapb. build-amxx.sh
          # selects the amxmodx branch for the ABI it is building.
          # arm64-v8a is mandatory; armeabi-v7a is best-effort (trial) and its
          # failure only drops the v7a bundle, it never fails the workflow.
          for ABI in arm64-v8a armeabi-v7a; do
            if RELEASE_VERSION="$BUNDLE_VERSION" bash ./android/ci/build-amxx.sh "$GITHUB_WORKSPACE/src" "$ANDROID_NDK_HOME" \
                "$GITHUB_WORKSPACE/build-out" "" "$ABI"; then
              echo "::group::OK $ABI"
              ls -l "$GITHUB_WORKSPACE/build-out/lib/$ABI" 2>/dev/null
              echo "::endgroup::"
            else
              echo "::endgroup::"
              if [ "$ABI" = "arm64-v8a" ]; then
                echo "::error::arm64-v8a cross-compile failed (required)"
                exit 1
              fi
              echo "::warning::armeabi-v7a cross-compile failed — v7a bundle will be skipped"
              touch "$GITHUB_WORKSPACE/v7a-missing"
            fi
          done

      - name: ccache stats (post native)
        if: steps.build_type.outputs.needs_libs == 'true' && steps.build_type.outputs.skip_native != 'true'
        shell: bash
        run: |
          if [ -n "${CCACHE:-}" ]; then ccache --show-stats || true; fi

      - name: Restore native outputs from release
        if: steps.build_type.outputs.needs_libs == 'true' && steps.build_type.outputs.skip_native == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Native inputs unchanged: reuse the previous .so set (+ on-device
          # compiler) instead of recompiling. Manifests/zip are regenerated
          # below with the new version.
          mkdir -p /tmp/prevso \
            "$GITHUB_WORKSPACE/build-out/lib/arm64-v8a" \
            "$GITHUB_WORKSPACE/build-out/lib/armeabi-v7a" \
            "$GITHUB_WORKSPACE/build-out/compiler/arm64-v8a" \
            "$GITHUB_WORKSPACE/build-out/compiler/armeabi-v7a" \
            "$GITHUB_WORKSPACE/build-out/plugins"
          cd /tmp/prevso
          gh release download continuous --repo "$GITHUB_REPOSITORY" \
            --pattern 'arm64-v8a__*' --pattern 'armeabi-v7a__*' --pattern 'compiler-*' \
            --clobber
          shopt -s nullglob
          for f in *; do
            case "$f" in
              compiler-arm64-v8a__*) cp "$f" "$GITHUB_WORKSPACE/build-out/compiler/arm64-v8a/${f#compiler-arm64-v8a__}" ;;
              compiler-armeabi-v7a__*) cp "$f" "$GITHUB_WORKSPACE/build-out/compiler/armeabi-v7a/${f#compiler-armeabi-v7a__}" ;;
              arm64-v8a__*) cp "$f" "$GITHUB_WORKSPACE/build-out/lib/arm64-v8a/${f#arm64-v8a__}" ;;
              armeabi-v7a__*) cp "$f" "$GITHUB_WORKSPACE/build-out/lib/armeabi-v7a/${f#armeabi-v7a__}" ;;
            esac
          done
          BO="$GITHUB_WORKSPACE/build-out"
          N64=$(ls "$BO/lib/arm64-v8a" | wc -l)
          echo "restored arm64 libs: $N64"
          [ "$N64" -ge 10 ] || { echo "::error::restore failed: too few arm64 libs"; exit 1; }
          [ -f "$BO/lib/arm64-v8a/libamxmodx.so" ] || { echo "::error::restore failed: no arm64 libamxmodx"; exit 1; }
          [ -f "$BO/lib/arm64-v8a/libcs_android_arm64.so" ] || { echo "::error::restore failed: no arm64 libcs"; exit 1; }
          [ -f "$BO/compiler/arm64-v8a/amxxpc" ] || { echo "::error::restore failed: no compiler"; exit 1; }
          [ -f "$BO/lib/armeabi-v7a/libamxmodx.so" ] || touch "$GITHUB_WORKSPACE/v7a-missing"
          [ -f "$BO/lib/armeabi-v7a/libcs_android_armv7l.so" ] || touch "$GITHUB_WORKSPACE/v7a-missing"

      - name: Restore on-device compilers from release
        if: steps.build_type.outputs.needs_android == 'true' && steps.build_type.outputs.needs_libs != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # [android] on its own: the patcher APK embeds amxxpc/amxxpc32 for both
          # ABIs, but those are native binaries. Instead of cross-compiling the
          # whole tree for an APK-only change, take the compilers the last [libs]
          # build already published (a few MB) and build only the APK.
          mkdir -p /tmp/prevpc \
            "$GITHUB_WORKSPACE/build-out/compiler/arm64-v8a" \
            "$GITHUB_WORKSPACE/build-out/compiler/armeabi-v7a"
          cd /tmp/prevpc
          gh release download continuous --repo "$GITHUB_REPOSITORY" \
            --pattern 'compiler-*' --clobber
          shopt -s nullglob
          for f in *; do
            case "$f" in
              compiler-arm64-v8a__*) cp "$f" "$GITHUB_WORKSPACE/build-out/compiler/arm64-v8a/${f#compiler-arm64-v8a__}" ;;
              compiler-armeabi-v7a__*) cp "$f" "$GITHUB_WORKSPACE/build-out/compiler/armeabi-v7a/${f#compiler-armeabi-v7a__}" ;;
            esac
          done
          PC="$GITHUB_WORKSPACE/build-out/compiler"
          ls -l "$PC/arm64-v8a"
          [ -f "$PC/arm64-v8a/amxxpc" ] || { echo "::error::no restored arm64 compiler"; exit 1; }
          [ -f "$PC/arm64-v8a/amxxpc32.so" ] || { echo "::error::no restored arm64 amxxpc32"; exit 1; }
          [ -f "$PC/armeabi-v7a/amxxpc" ] || touch "$GITHUB_WORKSPACE/v7a-missing"
          [ -f "$PC/armeabi-v7a/amxxpc32.so" ] || touch "$GITHUB_WORKSPACE/v7a-missing"

      - name: Build ReGameDLL libcs (first-spawn fix)
        if: steps.build_type.outputs.needs_libs == 'true' && steps.build_type.outputs.skip_native != 'true'
        shell: bash
        run: |
          set -euo pipefail
          # libcs is bundled from the berkchy/ReGameDLL_CS fork branch carrying the
          # first-spawn fix; built standalone with the NDK already installed above.
          # Both ABIs are built: shipping v7a amxmodx modules without a matching
          # v7a gamedll would leave the base APK's unpatched libcs in place.
          # arm64-v8a is required; armeabi-v7a is best-effort like the cross-compile
          # above, and a failure drops the whole v7a bundle.
          RGDLL="$GITHUB_WORKSPACE/rgdll-src"
          rm -rf "$RGDLL"
          mkdir -p "$RGDLL"
          # Fetched as a tarball rather than a clone: the gamedata measurement
          # needs a specific file out of the tree, and a shallow clone that
          # comes back without its checkout used to fail much later.
          # The head of that branch is also what stamps libcs in the
          # manifest, so a phone only re-downloads it when the branch moved.
          RGDLL_BRANCH=fix/first-spawn-equip
          curl -fsSL "https://api.github.com/repos/berkchy/ReGameDLL_CS/commits/$RGDLL_BRANCH" \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["sha"][:12])' \
            > "$GITHUB_WORKSPACE/rgdll-sha" \
            || echo unknown > "$GITHUB_WORKSPACE/rgdll-sha"
          echo "regamedll $RGDLL_BRANCH -> $(cat "$GITHUB_WORKSPACE/rgdll-sha")"
          curl -fsSL "https://codeload.github.com/berkchy/ReGameDLL_CS/tar.gz/refs/heads/$RGDLL_BRANCH" \
            | tar -xz -C "$RGDLL" --strip-components=1
          # The gamedll measures its own cstrike pdata offsets out of the debug
          # info it compiles with, but the fork builds with -g0 and strips at
          # link time. Keep -g1 (class layouts, no locals) and skip the -s; the
          # debug sections are removed again below.
          python3 - "$RGDLL" <<'PY'
          import glob, os, sys
          root = sys.argv[1]
          edits = (
              ('-g0 -O3 -fno-stack-protector', '-g2 -O3 -fno-stack-protector'),
              ('set(LINK_FLAGS "-s")', 'set(LINK_FLAGS "")'),
          )
          patched = []
          for path in glob.glob(os.path.join(root, '**', 'CMakeLists.txt'), recursive=True):
              text = open(path, encoding='utf-8').read()
              if not any(old in text for old, _ in edits):
                  continue
              for old, new in edits:
                  if old in text:
                      text = text.replace(old, new)
              open(path, 'w', encoding='utf-8').write(text)
              patched.append(path)
          if not patched:
              sys.exit("ERROR: no gamedll CMakeLists.txt with the expected build flags in %s" % root)
          print("patched ReGameDLL build flags for gamedata measurement:")
          for path in patched:
              print("  " + path)
          PY
          NDKBIN="$(echo "$ANDROID_NDK_HOME"/toolchains/llvm/prebuilt/*/bin)"
          TPL="$GITHUB_WORKSPACE/addons/amxmodx/data/gamedata/common.games/custom/offsets-cstrike-replugged.arm64.txt"
          for ABI in arm64-v8a armeabi-v7a; do
            case "$ABI" in
              arm64-v8a) NAME=libcs_android_arm64.so; VARIANT=arm64 ;;
              armeabi-v7a) NAME=libcs_android_armv7l.so; VARIANT=arm32 ;;
            esac
            BUILD="$GITHUB_WORKSPACE/rgdll-build-$ABI"
            SO="$BUILD/regamedll/$NAME"
            if cmake -S "$RGDLL" -B "$BUILD" \
                -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" \
                -DCMAKE_C_COMPILER_LAUNCHER="${CCACHE:-}" \
                -DCMAKE_CXX_COMPILER_LAUNCHER="${CCACHE:-}" \
                -DANDROID_ABI="$ABI" \
                -DANDROID_PLATFORM=android-21 \
                -DXASH_COMPAT=ON \
                -DCMAKE_BUILD_TYPE=Release &&
               cmake --build "$BUILD" --target regamedll --parallel 2 &&
               [ -f "$SO" ]; then
              # Measure this build's cstrike pdata offsets straight out of the
              # DWARF the build just emitted, so the table can never drift from
              # the shipped gamedll (DW_AT_data_member_location == offsetof).
              "$NDKBIN/llvm-readelf" -S "$SO" | grep -i "debug" || echo "  (no debug sections in $SO)"
              python3 ./android/ci/gamedata-offsets.py dump "$TPL" \
                --dwarfdump "$NDKBIN/llvm-dwarfdump" --so "$SO" --out "$BUILD/gamedll.dwarf"
              echo "  dwarf dump: $(wc -c < "$BUILD/gamedll.dwarf") bytes"
              if python3 ./android/ci/gamedata-offsets.py measure "$TPL" \
                  "$BUILD/gamedll.dwarf" "$BUILD/offsets-$VARIANT.txt"; then
                # Both ABIs are regenerated from the build that is about to ship.
                # arm64 used to be only checked against the committed table, so
                # its overrides stayed from an older libcs and AMXX reported a
                # CRC mismatch plus "sv/svs global variable is not available" on
                # 64-bit devices.
                case "$VARIANT" in
                  arm64) ABI_ARG=arm64-v8a ;;
                  *)     ABI_ARG=armeabi-v7a ;;
                esac
                python3 ./android/ci/gamedata-offsets.py emit "$TPL" \
                  "$BUILD/offsets-$VARIANT.txt" \
                  "$(dirname "$TPL")/offsets-cstrike-replugged.$VARIANT.txt" \
                  --abi "$ABI_ARG" \
                  --note "Generated by android/ci/gamedata-offsets.py from this build's libcs."
              else
                echo "::warning::gamedata offset measurement failed for $ABI (shipping without an override)"
              fi
              # Measurement scaffolding only: the shipped gamedll is stripped again.
              "$NDKBIN/llvm-strip" "$SO"
              mkdir -p "$GITHUB_WORKSPACE/build-out/lib/$ABI"
              cp "$SO" "$GITHUB_WORKSPACE/build-out/lib/$ABI/$NAME"
              ls -l "$GITHUB_WORKSPACE/build-out/lib/$ABI/$NAME"
              continue
            fi
            if [ "$ABI" = "arm64-v8a" ]; then
              echo "::error::$NAME was not produced (required)"
              exit 1
            fi
            echo "::warning::$NAME was not produced — v7a bundle will be dropped"
            touch "$GITHUB_WORKSPACE/v7a-missing"
          done

      - name: Package release bundles
        if: steps.build_type.outputs.needs_libs == 'true'
        shell: bash
        run: |
          # The manifest this build supersedes, so a file whose bytes did not
          # change keeps its old build stamp instead of being marked new.
          # Without it every release would look like a full rebuild.
          PREV="$GITHUB_WORKSPACE/prev-manifest"
          mkdir -p "$PREV"
          for f in manifest.json manifest-v7a.json; do
            curl -fsSL -o "$PREV/$f" \
              "https://github.com/berkchy/nexora/releases/download/continuous/$f" \
              || echo "no previous $f"
          done

          # Incremental update: individual .so files + manifest.json
          #
          # Producer stamps, not the sha of the output. The build is not
          # reproducible - libclient_android_*.so built from an identical tree on
          # 7 Oct and 12 Oct came out the same byte count with different
          # content - so a sha stamp advances on every release and the phone
          # re-downloads libraries nobody touched. These ask the question the
          # stamp should be asking: did anything that goes into this library
          # change? A cs16-client commit now costs three downloads instead of
          # seven, and an amxmodx-only change costs none of them.
          PRODUCER_ARGS=()
          # git rev-parse HEAD:<path> resolves to the tree sha for a tracked directory
          # and to the pinned gitlink commit for a submodule, so one helper
          # covers 3rdparty/*. cs16-client is neither: it is untracked, so its
          # stamp comes from the clone that was just checked out.
          sub_sha() {
            local path="$1" out
            out="$(git rev-parse --verify --quiet "HEAD:$path" 2>/dev/null || true)"
            [ -n "$out" ] && echo "$out" || echo "unknown"
          }
          dir_sha() {
            local path="$1" out
            out="$(git -C "$path" rev-parse --verify --quiet HEAD 2>/dev/null || true)"
            [ -n "$out" ] && echo "$out" || echo "unknown"
          }
          PRODUCER_ARGS+=(--producer "cs16-client=$(dir_sha cs16-client)")
          PRODUCER_ARGS+=(--producer "amxmodx=$(sub_sha 3rdparty/amxmodx)")
          PRODUCER_ARGS+=(--producer "metamod=$(sub_sha 3rdparty/metamod-fwgs)")
          PRODUCER_ARGS+=(--producer "yapb=$(sub_sha 3rdparty/yapb)")
          if [ -f "$GITHUB_WORKSPACE/rgdll-sha" ]; then
            PRODUCER_ARGS+=(--producer "regamedll=$(cat "$GITHUB_WORKSPACE/rgdll-sha")")
          fi
          echo "producer stamps: ${PRODUCER_ARGS[*]}"

          RELEASE_VERSION="$BUNDLE_VERSION" python3 ./android/ci/gen-manifest.py \
            arm64-v8a \
            "$GITHUB_WORKSPACE/build-out/lib/arm64-v8a" \
            "$GITHUB_WORKSPACE/incremental" \
            --plugins-dir "$GITHUB_WORKSPACE/build-out/plugins" \
            --previous "$PREV/manifest.json" \
            "${PRODUCER_ARGS[@]}"
          # Rename manifest for arm64 (default ABI keeps manifest.json name)
          mv "$GITHUB_WORKSPACE/incremental/manifest.json" "$GITHUB_WORKSPACE/manifest.json"

          if [ ! -f "$GITHUB_WORKSPACE/v7a-missing" ] && \
              [ -f "$GITHUB_WORKSPACE/build-out/lib/armeabi-v7a/libamxmodx.so" ]; then
            RELEASE_VERSION="$BUNDLE_VERSION" python3 ./android/ci/gen-manifest.py \
              armeabi-v7a \
              "$GITHUB_WORKSPACE/build-out/lib/armeabi-v7a" \
              "$GITHUB_WORKSPACE/incremental-v7a" \
              --previous "$PREV/manifest-v7a.json" \
              "${PRODUCER_ARGS[@]}"
            # Rename manifest for v7a to avoid conflict
            mv "$GITHUB_WORKSPACE/incremental-v7a/manifest.json" "$GITHUB_WORKSPACE/manifest-v7a.json"
          fi

          # Addons zip
          cd "$GITHUB_WORKSPACE"
          zip -r amxx-addons.zip addons/ -x '*.gitignore' '*.git/*'

          # Game assets zip.
          #
          # The client APK is now a ~2 MB shell: it carries only the menu
          # library, because nexora injects its own libclient into the package
          # at patch time. That means the game content (sound, maps, gfx,
          # touch, and the touch.cfg/bot db files the menu and the bot data
          # loader read by path) has to come from here instead - the engine
          # resolves it from the game directory, and with an empty assets/ in
          # the APK there is nothing left to find.
          #
          # Taken from the cs16-client tree, which is the only copy: the shell build
          # no longer merges it into the APK, so this is the single source.
          ASSETS_DIR="$GITHUB_WORKSPACE/cs16-client/3rdparty/cs16client-extras"
          if [ ! -d "$ASSETS_DIR" ]; then
            echo "::error::client assets tree is missing at $ASSETS_DIR"
            exit 1
          fi
          echo "packaging game assets from $ASSETS_DIR"
          (cd "$ASSETS_DIR" && zip -r -9 "$GITHUB_WORKSPACE/game-assets.zip" . \
            -x '*.gitignore' '*.git/*')

          # The patcher checks these before it patches anything, so a truncated
          # or partial zip has to fail here rather than on the user's device.
          unzip -tq "$GITHUB_WORKSPACE/game-assets.zip"
          for f in touch.cfg touch_default/numbers.cfg BotProfile.db BotChatter.db \
                   gfx/shell/btn_touch.bmp maps/tr_1.bsp sound/radio/bot/a.wav; do
            unzip -l "$GITHUB_WORKSPACE/game-assets.zip" "$f" | grep -q "$f" || {
              echo "::error::$f missing from game-assets.zip"; exit 1; }
          done
          ls -la "$GITHUB_WORKSPACE/game-assets.zip"

          # build-meta.json: lets the next run's skip guard know which commit
          # + upstream SHAs the native outputs correspond to.
          UPSTREAMS_JSON='${{ steps.build_type.outputs.upstreams_json }}' \
          NATIVE_SHA_OUT='${{ steps.build_type.outputs.native_sha_out }}' \
          python3 - "$GITHUB_WORKSPACE/build-meta.json" <<'PY'
          import json, os, subprocess, sys
          out = sys.argv[1]
          commit = subprocess.run(['git', 'rev-parse', 'HEAD'],
                                  capture_output=True, text=True).stdout.strip()
          try:
              upstreams = json.loads(os.environ.get('UPSTREAMS_JSON', '{}'))
          except Exception:
              upstreams = {}
          native_sha = os.environ.get('NATIVE_SHA_OUT') or commit
          json.dump({"commit": commit, "native_sha": native_sha,
                     "upstreams": upstreams}, open(out, 'w'))
          print(open(out).read())
          PY

          # Stage on-device compiler binaries as ABI-prefixed release assets
          # (plain names would collide across ABIs).
          mkdir -p "$GITHUB_WORKSPACE/compiler-assets"
          cf="$GITHUB_WORKSPACE/build-out/compiler"
          [ -f "$cf/arm64-v8a/amxxpc" ] && cp "$cf/arm64-v8a/amxxpc" "$GITHUB_WORKSPACE/compiler-assets/compiler-arm64-v8a__amxxpc"
          [ -f "$cf/arm64-v8a/amxxpc32.so" ] && cp "$cf/arm64-v8a/amxxpc32.so" "$GITHUB_WORKSPACE/compiler-assets/compiler-arm64-v8a__amxxpc32.so"
          if [ ! -f "$GITHUB_WORKSPACE/v7a-missing" ]; then
            [ -f "$cf/armeabi-v7a/amxxpc" ] && cp "$cf/armeabi-v7a/amxxpc" "$GITHUB_WORKSPACE/compiler-assets/compiler-armeabi-v7a__amxxpc"
            [ -f "$cf/armeabi-v7a/amxxpc32.so" ] && cp "$cf/armeabi-v7a/amxxpc32.so" "$GITHUB_WORKSPACE/compiler-assets/compiler-armeabi-v7a__amxxpc32.so"
          fi
          ls "$GITHUB_WORKSPACE/compiler-assets" || true

      - name: Install Android SDK platform & build tools
        if: steps.build_type.outputs.needs_android == 'true'
        shell: bash
        run: |
          # The runner's preinstalled sdkmanager is too old for current SDK XML
          # (v4), which silently breaks --install. Use a fresh cmdline-tools zip.
          CMDT=commandlinetools-linux-11076708_latest.zip
          mkdir -p "$RUNNER_TEMP/sdkman"
          curl -fsSL -o "$RUNNER_TEMP/$CMDT" "https://dl.google.com/android/repository/$CMDT"
          rm -rf "$RUNNER_TEMP/sdkman/cmdline-tools"
          unzip -qo "$RUNNER_TEMP/$CMDT" -d "$RUNNER_TEMP/sdkman"
          SDKM="$RUNNER_TEMP/sdkman/cmdline-tools/bin/sdkmanager"
          yes | "$SDKM" --sdk_root="$ANDROID_HOME" --licenses >/dev/null 2>&1 || true
          "$SDKM" --sdk_root="$ANDROID_HOME" --install "platforms;android-36" "build-tools;35.0.0"
          test -d "$ANDROID_HOME/platforms/android-36"
          test -d "$ANDROID_HOME/build-tools/35.0.0"

      - name: Set up Gradle
        if: steps.build_type.outputs.needs_android == 'true'
        uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: false

      - name: Bundle debug signing keystore into app assets
        if: steps.build_type.outputs.needs_android == 'true'
        shell: bash
        run: |
          mkdir -p android/app/src/main/assets/keystore
          cp android/debug/patcher-release.p12 android/app/src/main/assets/keystore/debug.p12
          cp android/debug/debug_key.pem android/app/src/main/assets/keystore/debug_key.pem
          cp android/debug/debug_cert.pem android/app/src/main/assets/keystore/debug_cert.pem

      - name: Embed amxxpc compiler as native libs
        if: steps.build_type.outputs.needs_android == 'true'
        shell: bash
        run: |
          # amxxpc compiler (produced by build-amxx.sh)
          mkdir -p android/app/src/main/jniLibs/arm64-v8a
          cp "$GITHUB_WORKSPACE/build-out/compiler/arm64-v8a/amxxpc" android/app/src/main/jniLibs/arm64-v8a/libamxxpc.so
          cp "$GITHUB_WORKSPACE/build-out/compiler/arm64-v8a/amxxpc32.so" android/app/src/main/jniLibs/arm64-v8a/libamxxpc32.so
          chmod +x android/app/src/main/jniLibs/arm64-v8a/libamxxpc.so
          # armeabi-v7a compiler (best-effort)
          if [ ! -f "$GITHUB_WORKSPACE/v7a-missing" ] && \
              [ -f "$GITHUB_WORKSPACE/build-out/compiler/armeabi-v7a/amxxpc" ]; then
            mkdir -p android/app/src/main/jniLibs/armeabi-v7a
            cp "$GITHUB_WORKSPACE/build-out/compiler/armeabi-v7a/amxxpc" android/app/src/main/jniLibs/armeabi-v7a/libamxxpc.so
            cp "$GITHUB_WORKSPACE/build-out/compiler/armeabi-v7a/amxxpc32.so" android/app/src/main/jniLibs/armeabi-v7a/libamxxpc32.so
            chmod +x android/app/src/main/jniLibs/armeabi-v7a/libamxxpc.so
          fi
          ls -lh android/app/src/main/jniLibs/arm64-v8a/

      - name: Build the patcher APK
        if: steps.build_type.outputs.needs_android == 'true'
        working-directory: android
        env:
          APP_VERSION_NAME: ${{ env.APP_VERSION_NAME }}
          APP_VERSION_CODE: ${{ env.APP_VERSION_CODE }}
        run: ./gradlew --no-daemon :app:assembleRelease --stacktrace

      - name: Rename APK to nexora_vX.X.X.apk
        if: steps.build_type.outputs.needs_android == 'true'
        shell: bash
        run: |
          cd android/app/build/outputs/apk/release
          APK=$(ls *.apk 2>/dev/null | head -1)
          if [ -n "$APK" ]; then
            mv "$APK" "${APK_NAME:-nexora.apk}"
            echo "Renamed: ${APK_NAME:-nexora.apk}"
          fi
          # version stamp for the in-app updater (version.txt string + byte check)
          echo "${APP_VERSION_NAME:-unknown}" > "$GITHUB_WORKSPACE/version.txt"
          cat "$GITHUB_WORKSPACE/version.txt"

      # cs16-client pins its own ndkVersion and its "continuous" build type passes
          # -DCMAKE_C_COMPILER_LAUNCHER=ccache into CMake, which fails outright
          # when ccache is missing. Neither is the r25c the .so build uses, so
          # both are installed here, only for the run that needs them.
      - name: Install client APK build deps
        if: steps.build_type.outputs.needs_android == 'true'
        shell: bash
        run: |
          set -e
          command -v ccache >/dev/null 2>&1 || { sudo apt-get update -qq && sudo apt-get install -y -qq ccache; }
          echo "ccache: $(command -v ccache)"
          NDK_VER=$(grep -oP 'ndkVersion\s*=\s*"\K[^"]+' cs16-client/android/app/build.gradle)
          echo "client ndk: $NDK_VER"
          SDKMANAGER=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)
          [ -n "$SDKMANAGER" ] || SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -d "$ANDROID_HOME/ndk/$NDK_VER" ]; then
            echo "y" | "$SDKMANAGER" "ndk;$NDK_VER" || true
          fi
          ls -d "$ANDROID_HOME/ndk/$NDK_VER"

      # The stock client APK the patcher adopts and rewrites. Built here rather
      # than fetched from the client repo's own release, so the whole update
      # chain - patcher, libs, client APK - resolves against a single rolling
      # release. Uses cs16-client's own gradle project and its "gitContinuous"
      # build type, which signs from the keystore below and drops the .test
      # application id suffix.
      - name: Build the client APK
        if: steps.build_type.outputs.needs_android == 'true'
        working-directory: cs16-client/android
        env:
          KEYSTORE_FILE_PATH: ${{ github.workspace }}/signingkey.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "${{ secrets.SIGNING_KEY }}" ]; then
            echo "${{ secrets.SIGNING_KEY }}" | base64 --decode > "$KEYSTORE_FILE_PATH"
            # Strip the client, the menu and the server out of the APK. Nexora
            # injects its own builds of the first two into this package at
            # patch time, so the copies gradle would put here are ~13 MB per
            # ABI of dead weight. Fails loudly if the pin moves and the patch
            # stops applying rather than silently shipping the fat APK again.
            git -C "$GITHUB_WORKSPACE/cs16-client" apply --check "$GITHUB_WORKSPACE/cs16-client-launcher.patch" \
              || { echo "::error::cs16-client-launcher.patch does not apply to $(cat "$GITHUB_WORKSPACE/cs16-client.pin")"; exit 1; }
            git -C "$GITHUB_WORKSPACE/cs16-client" apply "$GITHUB_WORKSPACE/cs16-client-launcher.patch"
            ./gradlew --no-daemon assembleGitContinuous --stacktrace
            cp app/build/outputs/apk/git/continuous/app-git-continuous.apk \
               "$GITHUB_WORKSPACE/CS16Client-Android.apk"
          else
            echo "::warning::SIGNING_KEY is empty, building the unsigned debug variant"
            ./gradlew --no-daemon assembleGitDebug --stacktrace
            cp app/build/outputs/apk/git/debug/app-git-debug.apk \
               "$GITHUB_WORKSPACE/CS16Client-Android.apk"
          fi
          ls -lh "$GITHUB_WORKSPACE/CS16Client-Android.apk"

      # Same rule as the version naming in "Detect build type": the
      # continuous tag, or a manual run on master. With the tag-only
      # condition this step was skipped on dispatch, so the run built
      # everything and then published nothing.
      - name: Release (rolling continuous)
        if: >-
          (startsWith(github.ref, 'refs/tags/') && github.ref_name == 'continuous') ||
          (github.event_name == 'workflow_dispatch' && github.ref_name == 'master') &&
          (steps.build_type.outputs.needs_android == 'true' ||
          steps.build_type.outputs.needs_libs == 'true')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Rolling release: the tag + release stay, only the assets of the side
          # that was rebuilt are replaced. An [android]-only build must not drop
          # the .so assets and a [libs]-only build must not drop the APK.
          if ! gh release view continuous >/dev/null 2>&1; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -f continuous
            git push origin continuous
            gh release create continuous \
              --title "Nexora Continuous" \
              --notes "Nexora Continuous build"
          fi
          # An asset is dropped only when the side it belongs to was rebuilt;
          # everything else stays untouched (upload --clobber replaces it).
          NEEDS_ANDROID="${{ steps.build_type.outputs.needs_android }}"
          NEEDS_LIBS="${{ steps.build_type.outputs.needs_libs }}"

          NEEDS_ANDROID="${{ steps.build_type.outputs.needs_android }}"
          NEEDS_LIBS="${{ steps.build_type.outputs.needs_libs }}"

          shopt -s nullglob

          # --- continuous tag: APK + version.txt only ---
          if [ "$NEEDS_ANDROID" = "true" ]; then
            if ! gh release view continuous >/dev/null 2>&1; then
              git config user.name "github-actions[bot]"
              git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
              git tag -f continuous
              git push origin continuous
              gh release create continuous --title "Nexora Continuous" --notes "Nexora Continuous build"
            fi
            gh release upload continuous --clobber version.txt android/app/build/outputs/apk/release/*.apk 2>/dev/null || true
          fi

          # --- libs tag: all native libs + manifests ---
          if [ "$NEEDS_LIBS" = "true" ]; then
            if ! gh release view libs >/dev/null 2>&1; then
              git config user.name "github-actions[bot]"
              git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
              git tag -f libs
              git push origin libs
              gh release create libs --title "Nexora Libs" --notes "Native libs and manifests (rolling)."
            fi
            gh release upload libs --clobber manifest.json manifest-v7a.json build-meta.json incremental/arm64-v8a/*.so incremental-v7a/armeabi-v7a/*.so compiler-assets/* 2>/dev/null || true
          fi

          # --- extras tag: addons + game assets ---
          if [ "$NEEDS_LIBS" = "true" ]; then
            if ! gh release view extras >/dev/null 2>&1; then
              git config user.name "github-actions[bot]"
              git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
              git tag -f extras
              git push origin extras
              gh release create extras --title "Nexora Extras" --notes "Addons and game assets (rolling)."
            fi
            gh release upload extras --clobber amxx-addons.zip game-assets.zip CS16Client-Android.apk 2>/dev/null || true
          fi

          BODY="Nexora Continuous build ${APP_VERSION_NAME:-}
          Commit: ${{ steps.build_type.outputs.commit_msg }}
          Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          Built: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          gh release edit continuous --title "Nexora Continuous" --notes "$BODY" 2>/dev/null || true

      - name: Release
        if: startsWith(github.ref, 'refs/tags/') && github.ref_name != 'continuous' && (steps.build_type.outputs.needs_android == 'true' || steps.build_type.outputs.needs_libs == 'true')
        uses: softprops/action-gh-release@v2
        with:
          body: ${{ steps.build_type.outputs.commit_msg }}
          files: |
            ${{ steps.build_type.outputs.needs_libs == 'true' && 'amxx-addons.zip
            manifest.json
            manifest-v7a.json
            build-meta.json
            compiler-assets/*
            incremental/arm64-v8a/*.so
            incremental-v7a/armeabi-v7a/*.so' || '' }}
            ${{ steps.build_type.outputs.needs_android == 'true' && 'version.txt
            android/app/build/outputs/apk/release/*.apk' || '' }}
          generate_release_notes: true
          fail_on_unmatched_files: false

      - name: Release extras (addons, assets, libs)
        # Publish the non-APK payloads under a rolling "extras" tag so they can
        # be fetched independently of the app release.
        if: >-
          success() &&
          (steps.build_type.outputs.needs_libs == 'true')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release delete extras --yes 2>/dev/null || true
          gh release create extras \
            --title "Nexora Extras" \
            --notes "Addons, game assets and native libs (rolling)." \
            amxx-addons.zip game-assets.zip manifest.json manifest-v7a.json build-meta.json \
            incremental/arm64-v8a/*.so incremental-v7a/armeabi-v7a/*.so compiler-assets/* 2>/dev/null || true
          echo "extras release updated"

      - name: Notify Discord on successful release
        # Only release tags (v*) announce themselves: `continuous` is the rolling
        # channel players already follow, and a manual dispatch on master
        # publishes to it without an announcement. Stable releases are the ones
        # worth a ping.
        if: >-
          success() &&
          startsWith(github.ref, 'refs/tags/v') &&
          (steps.build_type.outputs.needs_android == 'true' || steps.build_type.outputs.needs_libs == 'true')
        shell: bash
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          # Via env, not inline: the subject is free text and an apostrophe in it
          # used to close the quoting of the echo below and kill the step.
          COMMIT_MSG_RAW: ${{ steps.build_type.outputs.commit_msg }}
        run: |
          if [ -z "$DISCORD_WEBHOOK" ]; then
            echo "DISCORD_WEBHOOK secret not set, skipping Discord notification"
            exit 0
          fi
          VERSION="${GITHUB_REF_NAME#v}"
          APK_FILE="nexora_v${VERSION}.apk"
          if [ "$GITHUB_REF_NAME" = "continuous" ] || [ "$GITHUB_REF_NAME" = "master" ]; then
            VERSION="${APP_VERSION_NAME:-continuous}"
            APK_FILE="nexora_continuous.apk"
          fi
          REPO="${GITHUB_REPOSITORY}"
          COMMIT_MSG=$(printf '%s' "$COMMIT_MSG_RAW" | head -c 500)
          NEEDS_LIBS='${{ steps.build_type.outputs.needs_libs }}'
          RELEASE_TAG="$GITHUB_REF_NAME"
          if [ "$RELEASE_TAG" = "master" ]; then
            RELEASE_TAG="continuous"
          fi
          RELEASE_URL="https://github.com/${REPO}/releases/tag/${RELEASE_TAG}"
          if compgen -G "android/app/build/outputs/apk/release/*.apk" >/dev/null; then
            APK_COUNT=$(ls android/app/build/outputs/apk/release/*.apk | wc -l)
          else
            APK_COUNT=0
          fi
          if [ "$APK_COUNT" -gt 0 ]; then
            TITLE="Nexora v${VERSION} released"
            if [ "$GITHUB_REF_NAME" = "continuous" ] || [ "$GITHUB_REF_NAME" = "master" ]; then
              TITLE="Nexora Continuous build ${VERSION}"
            fi
            STATUS_FIELD=":white_check_mark: App update ready"
            TYPE_FIELD="App + libs"
            APK_URL="https://github.com/${REPO}/releases/download/${RELEASE_TAG}/${APK_FILE}"
            APK_FIELD="[${APK_FILE}](${APK_URL})"
          elif [ "$NEEDS_LIBS" = "true" ]; then
            TITLE="Nexora v${VERSION} libs & plugins update"
            STATUS_FIELD=":white_check_mark: Libs & plugins updated"
            TYPE_FIELD="Bundle (libs & plugins)"
            APK_FIELD=""
          else
            # Marker-less commit (docs/config/infra): no app or lib changes,
            # announce the tag as a plain update notice.
            TITLE="Nexora v${VERSION} update info"
            STATUS_FIELD=":information_source: Update posted"
            TYPE_FIELD="Update info"
            APK_FIELD=""
          fi
          BODY=$(jq -n \
            --arg title "$TITLE" \
            --arg description "$COMMIT_MSG" \
            --arg url "$RELEASE_URL" \
            --arg status "$STATUS_FIELD" \
            --arg version "$VERSION" \
            --arg type "$TYPE_FIELD" \
            --arg download "${APK_FIELD:-}" \
            '{embeds:[{title:$title,description:$description,color:5763719,url:$url,
              thumbnail:{url:"attachment://thumbnail.jpg"},
              image:{url:"attachment://image.jpg"},
              fields:([{name:"Status",value:$status,inline:true},
                       {name:"Version",value:$version,inline:true},
                       {name:"Type",value:$type,inline:true}]
                      + (if $download == "" then [] else [{name:"Download",value:$download,inline:true}] end))}]}'
          )
          curl -fsSL -F "payload_json=$BODY" \
            -F "thumbnail=@.github/assets/thumbnail.jpg" \
            -F "image=@.github/assets/image.jpg" \
            "$DISCORD_WEBHOOK" 2>&1 >/dev/null || { echo "Failed to send Discord webhook (exit=$?)"; exit 0; }
