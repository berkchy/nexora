name: build & release (release tag)

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version tag (e.g. v1.11.0)'
        required: false
        default: 'v1.11.0'

permissions:
  contents: write

env:
  ANDROID_DIR: android

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Detect version
        id: ver
        shell: bash
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            V="${{ github.event.inputs.version }}"
          else
            V="${GITHUB_REF_NAME}"
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "APP_VERSION_NAME=$V" >> "$GITHUB_ENV"
          echo "APP_VERSION_CODE=$(date -u +%s)" >> "$GITHUB_ENV"

      - name: Build the patcher APK
        working-directory: android
        env:
          APP_VERSION_NAME: ${{ env.APP_VERSION_NAME }}
          APP_VERSION_CODE: ${{ env.APP_VERSION_CODE }}
        run: ./gradlew --no-daemon :app:assembleRelease --stacktrace

      - name: Prepare release assets
        shell: bash
        run: |
          cd android/app/build/outputs/apk/release
          APK=$(ls *.apk 2>/dev/null | head -1)
          if [ -n "$APK" ]; then
            mv "$APK" "nexora.apk"
          fi
          echo "${APP_VERSION_NAME:-unknown}" > "$GITHUB_WORKSPACE/version.txt"
          cat "$GITHUB_WORKSPACE/version.txt"
          ls -lh "$GITHUB_WORKSPACE/android/app/build/outputs/apk/release/"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.version }}
          name: Nexora ${{ steps.ver.outputs.version }}
          files: |
            android/app/build/outputs/apk/release/nexora.apk
            version.txt
          generate_release_notes: true
