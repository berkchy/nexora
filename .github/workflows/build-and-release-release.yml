name: build & release (release tag)

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version tag (e.g. v1.11.0)'
        required: false
        default: 'v1.11.0'

permissions:
  contents: write

env:
  ANDROID_DIR: android

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Detect version
        id: ver
        shell: bash
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            V="${{ github.event.inputs.version }}"
          else
            V="${GITHUB_REF_NAME}"
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "APP_VERSION_NAME=$V" >> "$GITHUB_ENV"
          echo "APP_VERSION_CODE=$(date -u +%s)" >> "$GITHUB_ENV"

      - name: Restore on-device compilers from libs release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/prevpc \
            "$GITHUB_WORKSPACE/build-out/compiler/arm64-v8a" \
            "$GITHUB_WORKSPACE/build-out/compiler/armeabi-v7a"
          cd /tmp/prevpc
          gh release download libs --repo "$GITHUB_REPOSITORY"             --pattern 'compiler-*' --clobber 2>/dev/null || true
          shopt -s nullglob
          for f in *; do
            case "$f" in
              compiler-arm64-v8a__*) cp "$f" "$GITHUB_WORKSPACE/build-out/compiler/arm64-v8a/${f#compiler-arm64-v8a__}" ;;
              compiler-armeabi-v7a__*) cp "$f" "$GITHUB_WORKSPACE/build-out/compiler/armeabi-v7a/${f#compiler-armeabi-v7a__}" ;;
            esac
          done
          ls -l "$GITHUB_WORKSPACE/build-out/compiler/arm64-v8a" || true

      - name: Bundle debug signing keystore into app assets
        shell: bash
        run: |
          mkdir -p android/app/src/main/assets/keystore
          cp android/debug/patcher-release.p12 android/app/src/main/assets/keystore/debug.p12
          cp android/debug/debug_key.pem android/app/src/main/assets/keystore/debug_key.pem
          cp android/debug/debug_cert.pem android/app/src/main/assets/keystore/debug_cert.pem

      - name: Embed amxxpc compiler as native libs
        shell: bash
        run: |
          mkdir -p android/app/src/main/jniLibs/arm64-v8a
          if [ -f "$GITHUB_WORKSPACE/build-out/compiler/arm64-v8a/amxxpc" ]; then
            cp "$GITHUB_WORKSPACE/build-out/compiler/arm64-v8a/amxxpc" android/app/src/main/jniLibs/arm64-v8a/libamxxpc.so
            cp "$GITHUB_WORKSPACE/build-out/compiler/arm64-v8a/amxxpc32.so" android/app/src/main/jniLibs/arm64-v8a/libamxxpc32.so
            chmod +x android/app/src/main/jniLibs/arm64-v8a/libamxxpc.so
          fi
          if [ -f "$GITHUB_WORKSPACE/build-out/compiler/armeabi-v7a/amxxpc" ]; then
            mkdir -p android/app/src/main/jniLibs/armeabi-v7a
            cp "$GITHUB_WORKSPACE/build-out/compiler/armeabi-v7a/amxxpc" android/app/src/main/jniLibs/armeabi-v7a/libamxxpc.so
            cp "$GITHUB_WORKSPACE/build-out/compiler/armeabi-v7a/amxxpc32.so" android/app/src/main/jniLibs/armeabi-v7a/libamxxpc32.so
            chmod +x android/app/src/main/jniLibs/armeabi-v7a/libamxxpc.so
          fi
          ls -lh android/app/src/main/jniLibs/arm64-v8a/ 2>/dev/null || true

      - name: Build the patcher APK
        working-directory: android
        env:
          APP_VERSION_NAME: ${{ env.APP_VERSION_NAME }}
          APP_VERSION_CODE: ${{ env.APP_VERSION_CODE }}
        run: ./gradlew --no-daemon :app:assembleRelease --stacktrace

      - name: Prepare release assets
        shell: bash
        run: |
          cd android/app/build/outputs/apk/release
          APK=$(ls *.apk 2>/dev/null | head -1)
          if [ -n "$APK" ]; then
            mv "$APK" "nexora.apk"
          fi
          echo "${APP_VERSION_NAME:-unknown}" > "$GITHUB_WORKSPACE/version.txt"
          cat "$GITHUB_WORKSPACE/version.txt"
          ls -lh "$GITHUB_WORKSPACE/android/app/build/outputs/apk/release/"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.version }}
          name: Nexora ${{ steps.ver.outputs.version }}
          files: |
            android/app/build/outputs/apk/release/nexora.apk
            version.txt
          generate_release_notes: true


      - name: Notify Discord on successful release
        if: success()
        shell: bash
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          set -euo pipefail
          if [ -z "$DISCORD_WEBHOOK" ]; then echo "no webhook"; exit 0; fi
          TAG="${{ steps.ver.outputs.version }}"
          python3 - "$TAG" "$DISCORD_WEBHOOK" <<'PYEOF'
          import sys, json, urllib.request
          tag = sys.argv[1]
          url = sys.argv[2]
          desc = (
            "## \U0001F4E3 Nexora " + tag + " \u2014 Stable Release\n\n"
            "**A new version is out!** Download the APK from the link below.\n\n"
            "### \U0001F4E6 Contents\n"
            "- `nexora.apk` \u2014 patcher app\n\n"
            "### \U0001F517 Download\n"
            "[**Download APK**](https://github.com/berkchy/nexora/releases/tag/" + tag + ")\n\n"
            "> *Note:* Libs and extras live in separate releases (`libs`, `extras`).\n\n"
            "*Auto-generated by Nexora CI.*"
          )
          payload = {
            "embeds": [{
              "title": "Nexora " + tag + " released",
              "description": desc,
              "color": 3944702,
              "footer": {"text": "Nexora CI \u2022 Stable Release"},
              "fields": [
                {"name": "Tag", "value": "`" + tag + "`", "inline": True},
              ],
            }]
          }
          data = json.dumps(payload, ensure_ascii=False).encode("utf-8")
          req = urllib.request.Request(url, data=data, headers={"Content-Type": "application/json; charset=utf-8", "User-Agent": "Nexora-CI/1.0"})
          try:
            urllib.request.urlopen(req)
            print("discord notified")
          except Exception as e:
            print("discord failed:", e)
          PYEOF
