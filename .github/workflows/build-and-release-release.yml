name: build & release (release tag)

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version tag (e.g. v1.11.0)'
        required: false
        default: 'v1.11.0'

permissions:
  contents: write

env:
  ANDROID_DIR: android

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Detect version
        id: ver
        shell: bash
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            V="${{ github.event.inputs.version }}"
          else
            V="${GITHUB_REF_NAME}"
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "APP_VERSION_NAME=$V" >> "$GITHUB_ENV"
          echo "APP_VERSION_CODE=$(date -u +%s)" >> "$GITHUB_ENV"

      - name: Download continuous APK
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p repacked
          gh release download continuous --repo "$GITHUB_REPOSITORY" --pattern nexora_continuous.apk --clobber
          mv nexora_continuous.apk repacked/nexora-continuous.apk
          ls -lh repacked/nexora-continuous.apk

      - name: Repack and sign release APK
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y apktool apksigner zipalign
          apktool d -f -s repacked/nexora-continuous.apk -o repacked-decoded
          python3 <<'PY'
          import os
          import re
          path = "repacked-decoded/AndroidManifest.xml"
          text = open(path, encoding="utf-8").read()
          version_name = os.environ["APP_VERSION_NAME"]
          version_code = os.environ["APP_VERSION_CODE"]
          text, name_count = re.subn(r'(android:versionName=")[^"]+', rf'\g<1>{version_name}', text, count=1)
          text, code_count = re.subn(r'(android:versionCode=")[^"]+', rf'\g<1>{version_code}', text, count=1)
          if name_count != 1 or code_count != 1:
              raise SystemExit(f"version attributes not found: name={name_count}, code={code_count}")
          open(path, "w", encoding="utf-8").write(text)
          print(f"versionName={version_name} versionCode={version_code}")
          PY
          apktool b -o repacked/nexora-unsigned.apk repacked-decoded
          zipalign -f -p 4 repacked/nexora-unsigned.apk repacked/nexora-aligned.apk
          apksigner sign \
            --ks android/debug/patcher-release.p12 \
            --ks-key-alias androiddebugkey \
            --ks-pass pass:android \
            --key-pass pass:android \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --out repacked/nexora.apk \
            repacked/nexora-aligned.apk
          apksigner verify --verbose repacked/nexora.apk
          ls -lh repacked/nexora.apk

      - name: Prepare release assets
        shell: bash
        run: |
          echo "${APP_VERSION_NAME:-unknown}" > "$GITHUB_WORKSPACE/version.txt"
          cat "$GITHUB_WORKSPACE/version.txt"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.version }}
          name: Nexora ${{ steps.ver.outputs.version }}
          files: |
            repacked/nexora.apk
            version.txt
          generate_release_notes: true


      - name: Notify Discord on successful release
        if: success()
        shell: bash
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          set -euo pipefail
          if [ -z "$DISCORD_WEBHOOK" ]; then echo "no webhook"; exit 0; fi
          TAG="${{ steps.ver.outputs.version }}"
          python3 - "$TAG" "$DISCORD_WEBHOOK" <<'PYEOF'
          import sys, json, urllib.request
          tag = sys.argv[1]
          url = sys.argv[2]
          desc = (
            "## \U0001F4E3 Nexora " + tag + " — Stable Release\n\n"
            "**A new version is out!** Download the APK from the link below.\n\n"
            "### \U0001F4E6 Contents\n"
            "- `nexora.apk` — patcher app\n\n"
            "### \U0001F517 Download\n"
            "[**Download APK**](https://github.com/berkchy/nexora/releases/tag/" + tag + ")\n\n"
            "> *Note:* Libs and extras live in separate releases (`libs`, `extras`).\n\n"
            "*Auto-generated by Nexora CI.*"
          )
          payload = {
            "embeds": [{
               "title": "Nexora " + tag + " released",
               "description": desc,
               "color": 3944702,
               "footer": {"text": "Nexora CI • Stable Release"},
               "fields": [
                 {"name": "Tag", "value": "`" + tag + "`", "inline": True},
               ],
             }]
          }
          data = json.dumps(payload, ensure_ascii=False).encode("utf-8")
          req = urllib.request.Request(url, data=data, headers={"Content-Type": "application/json; charset=utf-8", "User-Agent": "Nexora-CI/1.0"})
          try:
              urllib.request.urlopen(req)
              print("discord notified")
          except Exception as e:
              print("discord failed:", e)
          PYEOF
