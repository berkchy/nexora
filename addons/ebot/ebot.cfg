// E-BOT default configuration (shipped with the bundle).
// exec'd automatically on every map start.

// Xash3D: bots need server-side simulation forcing to think/move.
sv_forcesimulating 1
ebot_running_on_xash 1

// Population & skill (defaults kept sane for mobile).
ebot_quota 10
ebot_force_team any
ebot_difficulty 4
ebot_min_skill 1
ebot_max_skill 100

// Waypoints: auto-analyze when no .ewp exists for the map, then persist.
// First visit of a map takes a while (matrix calculation); later visits
// load instantly from addons/ebot/waypoints/.
ebot_analyze_auto_start 1
ebot_analyze_grid_distance 40
