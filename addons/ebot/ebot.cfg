// Shows the which version of ebot is running on the host
ebot_version

// Specifies number of ebots playing on the host machine
//
// Default value: 10
ebot_quota "10"

// Specifies to always keep x amount of empty slot for humans
//
// Default value: 1
ebot_keep_slots "1"

// Specifies bot difficulty
// From 0 to 4, 4 > 0
// -1 = Random
//
// Default value: 4
ebot_difficulty "4"

// Specifies ebot skill (only if ebot_difficulty is set to -1)
// 1 = Worst / 100 = Best
//
// Default value: 1 / 100
ebot_min_skill "1"
ebot_max_skill "100"

// Specifies the team, in which all creating bots will be forced to join
//
// Default value: any
ebot_force_team "any"

// If this value is "0" ebots will dont use any nametag
// If this value is "1" ebots will use [E-BOT] nametag
// If this value is "2" ebots will use [E-BOT] nametag + skill showed in name
//
// Default value: 2
ebot_name_tag "2"

// Specifies to give steam avatars to ebots
// Configuration at: avatars.cfg
//
// Default value: 0
ebot_display_avatar "0"

// Specifies to give fake pings to ebots
//
// Default value: 0
ebot_fake_ping "0"

// Specifies if all ebots on the server stopbots function, while this variable set to 1
//
// Default value: 0
ebot_stop_bots "0"

// Specifies ebots can use flashlight
//
// Default value: 0
ebot_force_flashlight "0"

// Specifies human ebots can use flares in dark areas if they see anything
// they never use it if they never see any enemy, for dont want reveal themself positions
// after enemy gone they can use it if no enemy visible in near
//
// Default value: 1
ebot_use_flares "1"

// Specifies chance of use grenades
//
// Default value: 60
ebot_use_grenade_percent "60"

// Specifies to check enemy rendering, useful if enemy can be invisible etc.
//
// Default value: 0
ebot_check_enemy_rendering "0"

// Specifies to check enemy invincibility, if enemies can have godmode etc.
//
// Default value: 0
ebot_check_enemy_invincibility "0"

// Specifies to consider glass, if set to 1 ebots will count glass as wall
//
// Default value: 0
ebot_aim_trace_consider_glass "0"

// Specifies ebot zombies can use wallhack to find alive humans, useful in too large maps and zombie hell like mods
//
// Default value: 0
ebot_zombie_wall_hack "0"

// Specifies human bots can aware of everything, this set to 1 automatically if "zp_lightning" is set to "a"
//
// Default value: 0
ebot_dark_mode "0"

// Specifies pasword key for setinfo information to acccess to the ebot menu and command
//
// Default value: ebot_pass
ebot_password_key "ebot_pass"

// Specifies password for accessing ebot menu and commands on the server running ebot
//
// Default value: ebot
ebot_password "ebot"

// Specifies to show waypoints without kicking ebots but editing is not allowed
//
// Default value: 0
ebot_show_waypoints "0"

// Specifies to let analyzer choose start position/waypoint for analyzing
// If disabled, you must add one waypoint for start analyzing process
//
// Default value: 1
ebot_analyze_starter_waypoints "1"

// Specifies to let ebots count zombies as danger threats while pathfinding process to avoid them better
// Turning this off might be lower your cpu usage
//
// Default value: 1
ebot_zombie_count_as_path_cost "1"

// Specifies to ebots avoid their teammates, set to 1 if your server has semiclip
//
// Default value: 0
ebot_has_semiclip "0"

// Specifies which breakables can be breaked
// If breakable health is higher than that value ebots will ignore it
//
// Default value: 3000.0
ebot_breakable_health_limit "3000.0"

// Specifies ebots to use faster A* algorithm, reduces AI performance
// Forced to 1 if waypoint number is higher than 2048
//
// Default value: 0
ebot_force_shortest_path "0"

// Specifies to ebots randomize cost of pathfinding
//
// Default value: 0.9
ebot_pathfinder_seed_min "0.9"

// Specifies to ebots randomize cost of pathfinding
//
// Default value: 1.1
ebot_pathfinder_seed_max "1.1"

// Specifies with of helicopter, put helicopter waypoint to where helicopter lands
// when it arrives bots should able to track helicopter
// ebot_debug 1 helps to figure out the best value for maps
//
// Default value: 54.0
ebot_helicopter_width "54.0"

// Specifies to use pathfinding to perform avoiding a zombie
// Makes human bots smarter but costs as more cpu usage
//
// Default value: 1
ebot_use_pathfinding_for_avoid "1"

// Specifies ebots should attack enemies or not
//
// Default value: 0
ebot_ignore_enemies "0"

// Similar to new round ebot no attack plugin, but better
// If ebots attack each other on any zombie mode set this value to infection start time
//
// Default value: 0.0
ebot_zp_delay_custom "0.0"

// Specifies to how much analyzer can expand around
// Higher is not good if you dont want edit the waypoints
//
// Default value: 40
ebot_analyze_grid_distance "40"

// Specifies to analyzer maximum ebot jump height
// More than 62 is not recommended, 65 is max jump height with default gravity
//
// Default value: 62
ebot_analyze_max_jump_height "62"

// Specifies to start analyzer if map doesnt have a waypoints just like how CZ Bots do
//
// Default value: 1
ebot_analyze_auto_start "1"

// Specifies ebot to download waypoint if no waypoint found for the map
//
// Default value: 0
ebot_download_waypoints "0"

// Specifies where to search waypoints for download
//
// Default value: 
ebot_download_waypoints_from ""

// Specifies where to search waypoint format for download
//
// Default value: ewp
ebot_download_waypoints_format "ewp"

// Specifies add human camp waypoints if there's none of them
// (Mostly on auto generated waypoints)
//
// Default value: 1
ebot_auto_human_camp_points "1"

// Specifies waypoint size
//
// Default value: 7
ebot_waypoint_size "7"

// Specifies default waypoint r color
//
// Default value: 0
ebot_waypoint_r "0"

// Specifies default waypoint g color
//
// Default value: 255
ebot_waypoint_g "255"

// Specifies default waypoint b color
//
// Default value: 0
ebot_waypoint_b "0"

// Specifies disable path matrix, reduces memory usage but costs more cpu usage
// (Also reduces AI's performance if set to 1/disabled, while being faster it lets bot use 3d path distance instead of 2d line so its accurate)
//
// Default value: 0
ebot_disable_path_matrix "0"

// Used to perform better auto generated waypoints for editing
// 1 = Little
// 2 = More
// Best with "ebot_analyze_grid_distance" set to "128"
//
// Default value: 0
ebot_analyze_post_processing "0"

// If you're having problems on xash engine set this to 1
//
// Default value: 0
ebot_running_on_xash "1"

// Enables query hook for bots, so it shows bots as real players in server browser
//
// Default value: 0
ebot_query_hook "0"
